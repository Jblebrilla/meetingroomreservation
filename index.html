<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPWS Meeting Room Availability</title>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
// Fallback to the Microsoft EU CDN region if the primary (US West) CDN
// didn't load — e.g. blocked by a corporate firewall/proxy.
if (typeof msal === "undefined") {
    document.write(unescape(
        "%3Cscript src='https://alcdn.msftauth.net/browser/2.38.3/js/msal-browser.min.js' type='text/javascript'%3E%3C/script%3E"
    ));
}
</script>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    color:#0078d4;
}

h3{
    margin-top:0;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:10px 15px;
    margin:5px 5px 5px 0;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#106ebe;
}

button.secondary{
    background:#e4e9ef;
    color:#0078d4;
}

button.secondary:hover{
    background:#d3dbe4;
}

button.secondary.active{
    background:#0078d4;
    color:white;
}

select,input{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    box-sizing:border-box;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f9f9f9;
    border:1px solid #ddd;
    border-radius:5px;
    white-space:pre-wrap;
}

.view-toggle{
    margin-bottom:15px;
}

.view-panel{
    display:none;
}

.view-panel.active{
    display:block;
}

/* Calendar view */
.cal-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.cal-controls input[type="date"]{
    margin:0;
    width:auto;
    flex:1;
}

.cal-grid{
    border:1px solid #ddd;
    border-radius:5px;
    overflow:hidden;
}

.cal-row{
    display:grid;
    grid-template-columns:70px 1fr;
    border-bottom:1px solid #eee;
}

.cal-row:last-child{
    border-bottom:none;
}

.cal-time{
    padding:6px 8px;
    font-size:12px;
    color:#666;
    background:#fafafa;
    border-right:1px solid #eee;
}

.cal-slot{
    padding:6px 8px;
    font-size:13px;
}

.cal-slot.free{
    background:#e9f9ee;
    color:#1a7d3a;
}

.cal-slot.busy{
    background:#fdecec;
    color:#c62828;
}

.cal-slot.unknown{
    background:#f4f4f4;
    color:#888;
}

.legend{
    margin-top:10px;
    font-size:12px;
    color:#666;
}

.legend span{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:2px;
    margin-right:4px;
    vertical-align:middle;
}
</style>
</head>
<body>

<div class="container">

<h1>MPWS Meeting Room Scheduler</h1>

<button onclick="login()">Login with Microsoft 365</button>

<h3>Room</h3>

<select id="room">
    <option value="boardroom@mpws.com.ph">MPWS Board Room</option>
    <option value="bigmeetingroom@mpws.com.ph">MPWS Big Meeting Room</option>
    <option value="trainingroom@mpws.com.ph">MPWS Training Room</option>
</select>

<div class="view-toggle">
    <button class="secondary active" id="btnViewCheck" onclick="switchView('check')">Check a time</button>
    <button class="secondary" id="btnViewCalendar" onclick="switchView('calendar')">Calendar view</button>
</div>

<!-- Single time-range check -->
<div class="view-panel active" id="panel-check">

    <label>Date</label>
    <input type="date" id="meetingDate">

    <label>Start Time</label>
    <input type="time" id="startTime">

    <label>End Time</label>
    <input type="time" id="endTime">

    <button onclick="checkAvailability()">Check Availability</button>

    <div id="result" class="result"></div>

</div>

<!-- Day calendar view -->
<div class="view-panel" id="panel-calendar">

    <div class="cal-controls">
        <input type="date" id="calDate">
        <button onclick="loadDayCalendar()">Load Day</button>
    </div>

    <div id="calGrid" class="cal-grid"></div>

    <div class="legend">
        <span style="background:#e9f9ee;"></span>Free
        <span style="background:#fdecec;margin-left:12px;"></span>Busy
        <span style="background:#f4f4f4;margin-left:12px;"></span>No data
    </div>

</div>

</div>

<script>

const msalConfig = {
    auth: {
        clientId: "9dc5b578-6f1d-4d42-aad1-4c46cb068caf",
        authority: "https://login.microsoftonline.com/b6430d0a-2d9f-4c12-ae6e-5b4d8aad7644",
        redirectUri: "http://localhost:5500"
    }
};

let msalInstance = null;
let accessToken = "";
let account = null;

const GRAPH_SCOPES = [
    "User.Read",
    "Calendars.ReadWrite",
    "Place.Read.All"
];

if (typeof msal === "undefined") {

    // Both CDN regions failed to load — almost always a network/firewall
    // block rather than a code problem. Surface this clearly instead of
    // letting later code throw a confusing "before initialization" error.
    window.addEventListener("DOMContentLoaded", function () {
        document.getElementById("result").innerHTML =
            "⚠️ Could not load the Microsoft sign-in library (MSAL). " +
            "This usually means your network or firewall is blocking " +
            "alcdn.msauth.net / alcdn.msftauth.net. Try a different " +
            "network, or ask IT to allow those domains.";
    });

} else {

    msalInstance = new msal.PublicClientApplication(msalConfig);

}

function switchView(view) {

    document.getElementById("panel-check").classList.toggle("active", view === "check");
    document.getElementById("panel-calendar").classList.toggle("active", view === "calendar");

    document.getElementById("btnViewCheck").classList.toggle("active", view === "check");
    document.getElementById("btnViewCalendar").classList.toggle("active", view === "calendar");
}

async function login() {

    if (!msalInstance) {
        alert("The Microsoft sign-in library didn't load — check your network/firewall (see the message below the form) and reload the page.");
        return;
    }

    try {

        const loginResponse = await msalInstance.loginPopup({
            scopes: GRAPH_SCOPES
        });

        account = loginResponse.account;

        const tokenResponse =
        await msalInstance.acquireTokenSilent({
            account: account,
            scopes: GRAPH_SCOPES
        });

        accessToken = tokenResponse.accessToken;

        document.getElementById("result").innerHTML =
        "✅ Successfully connected to Microsoft 365";

    }
    catch(error){
        console.error(error);
        alert(error.message);
    }
}

async function getSchedule(room, startDateTime, endDateTime, intervalMinutes) {

    const response = await fetch(
        "https://graph.microsoft.com/v1.0/me/calendar/getSchedule",
        {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + accessToken,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                schedules: [room],
                startTime: {
                    dateTime: startDateTime,
                    timeZone: "Singapore Standard Time"
                },
                endTime: {
                    dateTime: endDateTime,
                    timeZone: "Singapore Standard Time"
                },
                availabilityViewInterval: intervalMinutes
            })
        });

    if (!response.ok) {
        const errBody = await response.text();
        throw new Error("Graph API error " + response.status + ": " + errBody);
    }

    const data = await response.json();

    if (!data.value || !data.value[0]) {
        throw new Error("No schedule data returned for this room.");
    }

    return data.value[0];
}

async function checkAvailability() {

    if(!accessToken){
        alert("Please login first.");
        return;
    }

    const room = document.getElementById("room").value;
    const date = document.getElementById("meetingDate").value;
    const start = document.getElementById("startTime").value;
    const end = document.getElementById("endTime").value;

    if(!date || !start || !end){
        alert("Please enter date and time.");
        return;
    }

    const startDateTime = date + "T" + start + ":00";
    const endDateTime = date + "T" + end + ":00";

    try {

        const schedule = await getSchedule(room, startDateTime, endDateTime, 30);

        if (
            schedule.availabilityView &&
            schedule.availabilityView.includes("1")
        ) {
            document.getElementById("result").innerHTML =
            "❌ Room is NOT available during the selected time.";
        }
        else {
            document.getElementById("result").innerHTML =
            "✅ Room is available.";
        }

        console.log(schedule);

    } catch(error) {

        console.error(error);

        document.getElementById("result").innerHTML =
        "Error checking availability: " + error.message;

    }
}

async function loadDayCalendar() {

    if(!accessToken){
        alert("Please login first.");
        return;
    }

    const room = document.getElementById("room").value;
    const date = document.getElementById("calDate").value;

    if(!date){
        alert("Please choose a date.");
        return;
    }

    const grid = document.getElementById("calGrid");
    grid.innerHTML = "Loading...";

    const dayStart = date + "T07:00:00";
    const dayEnd = date + "T19:00:00";
    const intervalMinutes = 30;

    try {

        const schedule = await getSchedule(room, dayStart, dayEnd, intervalMinutes);
        renderDayCalendar(schedule, dayStart, intervalMinutes);

    } catch(error) {

        console.error(error);
        grid.innerHTML = "Error loading calendar: " + error.message;

    }
}

function renderDayCalendar(schedule, dayStartIso, intervalMinutes) {

    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    const view = schedule.availabilityView || "";
    const startTime = new Date(dayStartIso);

    for (let i = 0; i < view.length; i++) {

        const slotStart = new Date(startTime.getTime() + i * intervalMinutes * 60000);
        const label = slotStart.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

        const status = view[i];
        let cssClass = "unknown";
        let text = "No data";

        if (status === "0") {
            cssClass = "free";
            text = "Free";
        } else if (status === "1" || status === "2" || status === "3") {
            cssClass = "busy";
            text = "Busy";
        }

        const row = document.createElement("div");
        row.className = "cal-row";

        const timeCell = document.createElement("div");
        timeCell.className = "cal-time";
        timeCell.textContent = label;

        const slotCell = document.createElement("div");
        slotCell.className = "cal-slot " + cssClass;
        slotCell.textContent = text;

        row.appendChild(timeCell);
        row.appendChild(slotCell);
        grid.appendChild(row);
    }

    if (view.length === 0) {
        grid.innerHTML = "No availability data returned for this day.";
    }
}

</script>

</body>
</html>
