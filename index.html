<style>
  :root {
    --paper: #EFEDE4;
    --paper-raised: #F7F5EE;
    --ink: #24262B;
    --ink-soft: #5B5D57;
    --line: #D8D4C8;
    --line-strong: #B9B4A4;
    --accent-big: #2E6B5C;
    --accent-board: #6B3A4A;
    --accent-training: #34587A;
    --accent-interview: #A67C2E;
    --danger: #A6402F;
    --focus: #1D6FE0;
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1C1F;
      --paper-raised: #242529;
      --ink: #EDEAE1;
      --ink-soft: #9C9A91;
      --line: #38393D;
      --line-strong: #4B4C50;
      --accent-big: #5FAF98;
      --accent-board: #C97D93;
      --accent-training: #7DA6D6;
      --accent-interview: #E0AF5C;
      --danger: #E2745F;
      --focus: #6AA6FF;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1C1F;
    --paper-raised: #242529;
    --ink: #EDEAE1;
    --ink-soft: #9C9A91;
    --line: #38393D;
    --line-strong: #4B4C50;
    --accent-big: #5FAF98;
    --accent-board: #C97D93;
    --accent-training: #7DA6D6;
    --accent-interview: #E0AF5C;
    --danger: #E2745F;
    --focus: #6AA6FF;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .mono { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }

  header.top {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--paper);
    z-index: 5;
  }
  .top-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: block;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .rooms-key {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .rooms-key span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 9px; height: 9px; border-radius: 1px; display: inline-block; }

  .week-nav {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .week-nav button.arrow {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    width: 30px;
    height: 30px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    flex: 0 0 auto;
  }
  .week-nav button.arrow:hover { border-color: var(--line-strong); }
  .day-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    flex: 1;
  }
  .day-tab {
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 5px 12px;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.5;
    white-space: nowrap;
  }
  .day-tab .dow { font-size: 11px; letter-spacing: 0.02em; }
  .day-tab .dom { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500; }
  .day-tab:hover { border-color: var(--line); }
  .day-tab.selected {
    border-color: var(--ink);
    color: var(--ink);
    background: var(--paper-raised);
  }
  .day-tab.today .dom { color: var(--focus); }

  main {
    flex: 1;
    padding: 20px 24px 40px;
    overflow: auto;
  }
  .grid-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-raised);
  }
  .grid {
    display: grid;
    grid-template-columns: 74px repeat(4, minmax(148px, 1fr));
    position: relative;
    min-width: 714px;
  }
  .head-cell {
    position: sticky;
    top: 0;
    background: var(--paper-raised);
    z-index: 2;
    padding: 10px 10px 9px;
    border-bottom: 1px solid var(--line-strong);
    border-left: 1px solid var(--line);
  }
  .head-cell:first-child { border-left: none; }
  .head-cell .room-name { font-size: 13px; font-weight: 600; }
  .head-cell .bar { height: 3px; border-radius: 2px; margin-top: 7px; }
  .time-cell {
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    color: var(--ink-soft);
    padding: 3px 8px 0 0;
    text-align: right;
    position: relative;
    white-space: nowrap;
  }
  .time-cell.hour { color: var(--ink); font-weight: 500; }
  .slot-btn {
    border: none;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
    background: transparent;
    cursor: pointer;
    padding: 0;
    height: 100%;
    width: 100%;
  }
  .slot-btn:hover { background: rgba(29, 111, 224, 0.08); }
  .slot-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; z-index: 3; }
  .slot-btn.hour-line { border-top: 1px solid var(--line-strong); }

  .booking-block {
    border-radius: var(--radius);
    margin: 1px 4px;
    padding: 5px 8px;
    font-size: 12px;
    line-height: 1.35;
    cursor: pointer;
    color: #fff;
    overflow: hidden;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .booking-block .b-title { font-weight: 600; }
  .booking-block .b-who { opacity: 0.88; font-size: 11px; }
  .booking-block.mine { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55); }
  .booking-block.pending {
    background-image: repeating-linear-gradient(
      135deg, rgba(255,255,255,0.28) 0 8px, rgba(255,255,255,0.06) 8px 16px
    ) !important;
    opacity: 0.9;
  }
  .booking-block .b-status { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.85; }
  .booking-block:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
  }
  .btn {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.primary:hover { opacity: 0.9; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 18, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
    animation: fade-in 0.12s ease-out;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    width: 100%;
    max-width: 380px;
    padding: 20px;
    animation: rise-in 0.14s ease-out;
  }
  @keyframes rise-in { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h2 { margin: 0 0 3px; font-size: 16px; }
  .modal .sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 16px; }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 12px 0 5px;
  }
  .modal input[type=text], .modal select {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 9px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }
  .modal input:focus, .modal select:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .modal-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 20px;
  }
  .modal-actions .left { display: flex; gap: 8px; }
  .warn {
    font-size: 12px;
    color: var(--danger);
    margin-top: 8px;
    min-height: 14px;
  }
  .view-row { font-size: 13.5px; margin: 4px 0; }
  .view-row .lbl { color: var(--ink-soft); display: inline-block; width: 64px; }

  .status-line {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
  }

  .fine-print {
    max-width: 900px;
    margin: 28px auto 12px;
    padding: 0 20px;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.7;
    text-align: center;
  }

  @media (max-width: 560px) {
    header.top { padding: 16px 16px 12px; }
    main { padding: 14px 12px 32px; }
    h1 { font-size: 17px; }
  }
</style>
</head>

<div id="modalRoot"></div>

<script>
(function () {
  "use strict";

  /* ---------- Configuration ---------- */

  var ROOMS = [
    { id: "big",       name: "BIG Meeting Room", color: "var(--accent-big)" },
    { id: "board",     name: "Board Room",       color: "var(--accent-board)" },
    { id: "training",  name: "Training Room",    color: "var(--accent-training)" },
    { id: "interview", name: "Interview Room",   color: "var(--accent-interview)" }
  ];

  var START_HOUR = 8;
  var END_HOUR = 18;
  var SLOT_MIN = 30;
  var SLOT_COUNT = ((END_HOUR - START_HOUR) * 60) / SLOT_MIN; // 20 half-hour slots
  var DURATIONS = [30, 60, 90, 120];
  var DAYS_IN_WEEK = 5;

  /* URL of the deployed Google Apps Script web app that reads/writes the
     Google Sheet used as the database. Fill this in — see setup notes.
     Leave it empty and the page runs in read-only preview mode. */
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzeoNKBADUemNwVPvzZQg9vWK1chkvVRMLK0Qe_q8vOt3kCVorKkr8G4LMRzzOP_wy-6g/exec";

  // How often to re-poll the sheet for changes made by other people (ms).
  var POLL_MS = 15000;

  var DOW = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------- Date helpers ---------- */

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function isoDate(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function mondayOf(d) {
    var x = new Date(d);
    var day = x.getDay(); // 0 Sun .. 6 Sat
    x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
    x.setHours(0, 0, 0, 0);
    return x;
  }

  function addDays(d, n) {
    var x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }

  function slotToLabel(i) {
    var totalMin = START_HOUR * 60 + i * SLOT_MIN;
    var h24 = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    var h12 = h24 % 12 || 12;
    return h12 + ":" + pad2(m) + " " + (h24 < 12 ? "AM" : "PM");
  }

  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function formatError(err, fallback) {
    return (err && err.code) ? err.code : (err && err.message) ? err.message : (fallback || "error");
  }

  /* ---------- State ---------- */

  var today = new Date();
  var todayIso = isoDate(today);
  var thisWeekStart = mondayOf(today);

  var weekStart = thisWeekStart;
  // Start on today, or on Monday when today falls on a weekend.
  var selectedDate = (today.getDay() === 0 || today.getDay() === 6)
    ? isoDate(thisWeekStart)
    : todayIso;

  var pollTimer = null;
  var bookings = [];
  var myId = getDeviceId();
  var myName = "";
  try { myName = localStorage.getItem("roomScheduler.name") || ""; } catch (e) {}
  var myEmail = "";
  try { myEmail = localStorage.getItem("roomScheduler.email") || ""; } catch (e) {}
  var pendingWrite = false;

  // A per-browser id so "Cancel booking" only appears on bookings made from
  // this device — there's no sign-in, so this is a light-touch stand-in for it.
  function getDeviceId() {
    try {
      var id = localStorage.getItem("roomScheduler.deviceId");
      if (!id) {
        id = "dev-" + Date.now() + "-" + Math.random().toString(36).slice(2);
        localStorage.setItem("roomScheduler.deviceId", id);
      }
      return id;
    } catch (e) {
      return "dev-" + Date.now();
    }
  }

  var gridEl = document.getElementById("grid");
  var dayTabsEl = document.getElementById("dayTabs");
  var roomsKeyEl = document.getElementById("roomsKey");
  var statusEl = document.getElementById("statusLine");
  var modalRoot = document.getElementById("modalRoot");
  var exportBtn = document.getElementById("exportBtn");

  function ready() { return !!APPS_SCRIPT_URL; }

  /* ---------- Sheet API (Google Apps Script web app) ---------- */

  function sheetList(dateIso) {
    var url = APPS_SCRIPT_URL + "?date=" + encodeURIComponent(dateIso);
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || data.ok === false) throw new Error((data && data.error) || "request failed");
      return data.bookings || [];
    });
  }

  function sheetCreate(payload) {
    // Sent as text/plain so the browser doesn't send a CORS preflight —
    // Apps Script web apps don't respond to OPTIONS requests.
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ action: "create" }, payload))
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || data.ok === false) throw new Error((data && data.error) || "request failed");
      return data;
    });
  }

  function sheetDelete(id) {
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", id: id })
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || data.ok === false) throw new Error((data && data.error) || "request failed");
      return data;
    });
  }

  function roomById(id) {
    for (var i = 0; i < ROOMS.length; i++) {
      if (ROOMS[i].id === id) return ROOMS[i];
    }
    return null;
  }

  /* ---------- Rendering ---------- */

  function renderRoomsKey() {
    roomsKeyEl.innerHTML = ROOMS.map(function (r) {
      return '<span><span class="swatch" style="background:' + r.color + '"></span>' +
        escapeHtml(r.name) + "</span>";
    }).join("");
  }

  function renderDayTabs() {
    var html = "";
    for (var i = 0; i < DAYS_IN_WEEK; i++) {
      var d = addDays(weekStart, i);
      var iso = isoDate(d);
      var cls = "day-tab" +
        (iso === selectedDate ? " selected" : "") +
        (iso === todayIso ? " today" : "");
      html += '<button type="button" class="' + cls + '" data-date="' + iso + '"' +
        (iso === selectedDate ? ' aria-current="date"' : "") + ">" +
        '<span class="dow">' + DOW[i] + "</span>" +
        '<span class="dom mono">' + d.getDate() + " " + MONTHS[d.getMonth()] + "</span>" +
        "</button>";
    }
    dayTabsEl.innerHTML = html;
  }

  function renderGridShell() {
    var html = '<div class="head-cell"></div>';

    ROOMS.forEach(function (r) {
      html += '<div class="head-cell"><div class="room-name">' + escapeHtml(r.name) +
        '</div><div class="bar" style="background:' + r.color + '"></div></div>';
    });

    for (var i = 0; i < SLOT_COUNT; i++) {
      var isHour = (i % 2) === 0;
      html += '<div class="time-cell' + (isHour ? " hour" : "") + ' mono" style="grid-row:' + (i + 2) + '">' +
        (isHour ? slotToLabel(i) : "") + "</div>";

      for (var c = 0; c < ROOMS.length; c++) {
        html += '<button type="button" class="slot-btn' + (isHour ? " hour-line" : "") + '" ' +
          'style="grid-column:' + (c + 2) + ";grid-row:" + (i + 2) + ';" ' +
          'data-room="' + ROOMS[c].id + '" data-slot="' + i + '" ' +
          'aria-label="Book ' + escapeHtml(ROOMS[c].name) + " at " + slotToLabel(i) + '"></button>';
      }
    }

    gridEl.innerHTML = html;
  }

  function renderBookingOverlays() {
    // Remove only the overlay blocks, leaving the slot grid intact.
    Array.prototype.forEach.call(gridEl.querySelectorAll(".booking-block"), function (el) {
      el.remove();
    });

    bookings.forEach(function (b) {
      var colIndex = ROOMS.findIndex(function (r) { return r.id === b.room; });
      if (colIndex === -1) return;

      var room = ROOMS[colIndex];
      var start = Math.max(0, b.startSlot);
      var end = Math.min(SLOT_COUNT, b.endSlot);
      if (end <= start) return;

      var el = document.createElement("div");
      el.className = "booking-block" +
        (myId && b.bookedById === myId ? " mine" : "") +
        (isPending(b) ? " pending" : "");
      el.style.gridColumn = String(colIndex + 2);
      el.style.gridRow = (start + 2) + " / " + (end + 2);
      el.style.background = room.color;
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.innerHTML = '<span class="b-title">' + escapeHtml(b.title || room.name) + "</span>" +
        '<span class="b-who">' + escapeHtml(b.bookedByName || "Someone") + "</span>" +
        (isPending(b) ? '<span class="b-status">Pending approval</span>' : "");

      el.addEventListener("click", function () { openViewModal(b); });
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openViewModal(b);
        }
      });

      gridEl.appendChild(el);
    });
  }

  function setStatus(text) { statusEl.textContent = text; }

  function describeDay(count) {
    if (!count) return "No bookings yet for this day.";
    var pendingCount = bookings.filter(function (b) { return isPending(b); }).length;
    var base = count + " booking" + (count === 1 ? "" : "s") + " on this day.";
    if (pendingCount) base += " " + pendingCount + " awaiting approval.";
    return base;
  }

  function isPending(b) {
    return String(b.status || "").toLowerCase() === "pending";
  }

  /* ---------- Data subscription ---------- */

  function subscribeToDate(dateIso) {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }

    if (!ready()) {
      bookings = [];
      renderBookingOverlays();
      return; // status line is owned by init() in this mode
    }

    // Keep the current day's blocks on screen until the new fetch lands,
    // instead of blanking the grid on every tab click.
    setStatus("Loading availability…");

    function poll() {
      sheetList(dateIso).then(function (rows) {
        // A day switch may have happened while this request was in flight.
        if (dateIso !== selectedDate) return;
        bookings = rows.map(function (data) {
          return {
            id: data.id,
            room: data.room,
            date: data.date,
            startSlot: Number(data.startSlot),
            endSlot: Number(data.endSlot),
            title: data.title,
            bookedById: data.bookedById || null,
            bookedByName: data.bookedByName || "",
            status: (data.status || "Approved")
          };
        });
        renderBookingOverlays();
        setStatus(describeDay(bookings.length));
        pollTimer = setTimeout(poll, POLL_MS);
      }).catch(function (err) {
        setStatus("Couldn't load availability (" + formatError(err) + "). Retrying…");
        pollTimer = setTimeout(poll, POLL_MS);
      });
    }

    poll();
  }

  // Re-fetch the current day right away, e.g. right after this device books
  // or cancels something, so it doesn't wait for the next poll tick.
  function refreshNow() {
    subscribeToDate(selectedDate);
  }

  function overlaps(roomId, startSlot, endSlot, ignoreId) {
    return bookings.some(function (b) {
      if (b.room !== roomId) return false;
      if (ignoreId && b.id === ignoreId) return false;
      return startSlot < b.endSlot && endSlot > b.startSlot;
    });
  }

  /* ---------- Modals ---------- */

  function closeModal() { modalRoot.innerHTML = ""; }

  function wireModalDismiss() {
    document.getElementById("ovl").addEventListener("click", function (e) {
      if (e.target.id === "ovl") closeModal();
    });
  }

  function openCreateModal(roomId, startSlot) {
    var room = roomById(roomId);
    if (!room) return;

    var maxDuration = (SLOT_COUNT - startSlot) * SLOT_MIN;
    var durationOptions = DURATIONS.filter(function (m) { return m <= maxDuration; });
    if (!durationOptions.length) durationOptions = [maxDuration];

    modalRoot.innerHTML =
      '<div class="overlay" id="ovl">' +
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
          '<h2 id="mTitle">Book ' + escapeHtml(room.name) + "</h2>" +
          '<div class="sub mono">' + selectedDate + " · starts " + slotToLabel(startSlot) + "</div>" +
          '<label for="fName">Your name</label>' +
          '<input type="text" id="fName" placeholder="e.g. Jamie Cruz" value="' + escapeHtml(myName) + '">' +
          '<label for="fEmail">Your email</label>' +
          '<input type="email" id="fEmail" placeholder="e.g. jamie@company.com" value="' + escapeHtml(myEmail) + '">' +
          '<label for="fTitle">Meeting title</label>' +
          '<input type="text" id="fTitle" placeholder="e.g. Weekly sync" maxlength="80">' +
          '<label for="fDuration">Duration</label>' +
          '<select id="fDuration">' +
            durationOptions.map(function (m) {
              var label = m < 60
                ? m + " min"
                : (m % 60 === 0 ? (m / 60) + " hr" : (m / 60).toFixed(1) + " hr");
              return '<option value="' + m + '">' + label + "</option>";
            }).join("") +
          "</select>" +
          '<div class="warn" id="fWarn" role="alert"></div>' +
          '<div class="modal-actions">' +
            '<div class="left"><button class="btn" id="btnCancel">Cancel</button></div>' +
            '<button class="btn primary" id="btnBook">Send for approval</button>' +
          "</div>" +
        "</div>" +
      "</div>";

    var nameEl = document.getElementById("fName");
    var emailEl = document.getElementById("fEmail");
    var titleEl = document.getElementById("fTitle");
    var durationEl = document.getElementById("fDuration");
    var warnEl = document.getElementById("fWarn");
    var btn = document.getElementById("btnBook");

    document.getElementById("btnCancel").addEventListener("click", closeModal);
    wireModalDismiss();
    nameEl.focus();

    btn.addEventListener("click", function () {
      var nameVal = nameEl.value.trim();
      var emailVal = emailEl.value.trim();
      var titleVal = titleEl.value.trim();
      var durMin = parseInt(durationEl.value, 10);
      warnEl.textContent = "";

      if (!nameVal) {
        warnEl.textContent = "Enter your name so others know who booked it.";
        return;
      }

      if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        warnEl.textContent = "Enter a valid email so we can tell you when it's approved.";
        return;
      }

      var endSlot = startSlot + Math.round(durMin / SLOT_MIN);

      if (overlaps(roomId, startSlot, endSlot, null)) {
        warnEl.textContent = "That room already has a pending or approved request in part of this window.";
        return;
      }

      if (pendingWrite) return;
      pendingWrite = true;
      btn.disabled = true;
      btn.textContent = "Sending…";

      myName = nameVal;
      myEmail = emailVal;
      try {
        localStorage.setItem("roomScheduler.name", nameVal);
        localStorage.setItem("roomScheduler.email", emailVal);
      } catch (e) {}

      sheetCreate({
        room: roomId,
        date: selectedDate,
        startSlot: startSlot,
        endSlot: endSlot,
        title: titleVal || room.name,
        bookedById: myId,
        bookedByName: nameVal,
        bookedByEmail: emailVal
      }).then(function () {
        closeModal();
        refreshNow();
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = "Send for approval";
        warnEl.textContent = "Couldn't send that request (" + formatError(err) + "). Try again.";
      }).then(function () {
        pendingWrite = false;
      });
    });
  }

  function openViewModal(b) {
    var room = roomById(b.room);
    if (!room) return;

    var mine = !!myId && b.bookedById === myId;
    var pending = isPending(b);

    modalRoot.innerHTML =
      '<div class="overlay" id="ovl">' +
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="vTitle">' +
          '<h2 id="vTitle">' + escapeHtml(b.title || room.name) + "</h2>" +
          '<div class="sub">' + escapeHtml(room.name) + "</div>" +
          '<div class="view-row"><span class="lbl">When</span><span class="mono">' +
            escapeHtml(b.date) + ", " + slotToLabel(b.startSlot) + "–" + slotToLabel(b.endSlot) + "</span></div>" +
          '<div class="view-row"><span class="lbl">Booked by</span>' +
            escapeHtml(b.bookedByName || "Someone") + "</div>" +
          '<div class="view-row"><span class="lbl">Status</span>' +
            (pending ? "Pending approval" : escapeHtml(b.status || "Approved")) + "</div>" +
          '<div class="warn" id="vWarn" role="alert"></div>' +
          '<div class="modal-actions">' +
            '<div class="left"><button class="btn" id="btnClose">Close</button></div>' +
            (mine
              ? '<button class="btn danger" id="btnCancelBooking">' +
                (pending ? "Withdraw request" : "Cancel booking") + "</button>"
              : "") +
          "</div>" +
        "</div>" +
      "</div>";

    document.getElementById("btnClose").addEventListener("click", closeModal);
    wireModalDismiss();

    var cancelBtn = document.getElementById("btnCancelBooking");
    if (!cancelBtn) return;
    var cancelLabel = pending ? "Withdraw request" : "Cancel booking";
    var cancellingLabel = pending ? "Withdrawing…" : "Cancelling…";

    cancelBtn.addEventListener("click", function () {
      cancelBtn.disabled = true;
      cancelBtn.textContent = cancellingLabel;
      sheetDelete(b.id).then(function () {
        closeModal();
        refreshNow();
      }).catch(function (err) {
        cancelBtn.disabled = false;
        cancelBtn.textContent = cancelLabel;
        document.getElementById("vWarn").textContent =
          "Couldn't do that (" + formatError(err) + ").";
      });
    });
  }

  /* ---------- CSV export ---------- */

  function csvEscape(v) {
    var s = v == null ? "" : String(v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportWeekCsv() {
    if (!ready()) {
      setStatus("Export unavailable right now.");
      return;
    }

    var weekDates = [];
    for (var i = 0; i < DAYS_IN_WEEK; i++) {
      weekDates.push(isoDate(addDays(weekStart, i)));
    }

    exportBtn.disabled = true;
    exportBtn.textContent = "Preparing export…";

    function resetExportBtn() {
      exportBtn.disabled = false;
      exportBtn.textContent = "Export week as CSV (Excel)";
    }

    Promise.all(weekDates.map(function (dateIso) {
      return sheetList(dateIso).then(function (rows) {
        return rows.map(function (data) {
          return {
            date: dateIso,
            room: data.room,
            startSlot: Number(data.startSlot),
            endSlot: Number(data.endSlot),
            title: data.title,
            bookedByName: data.bookedByName,
            status: data.status || "Approved"
          };
        });
      });
    })).then(function (perDay) {
      var rows = [["Date", "Room", "Start", "End", "Title", "Booked by", "Status"]];

      perDay.forEach(function (list) {
        list.sort(function (a, b) { return a.startSlot - b.startSlot; });
        list.forEach(function (b) {
          var room = roomById(b.room);
          rows.push([
            b.date,
            room ? room.name : b.room,
            slotToLabel(b.startSlot),
            slotToLabel(b.endSlot),
            b.title || "",
            b.bookedByName || "",
            b.status || ""
          ]);
        });
      });

      var csv = rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
      var filename = "room-bookings-" + weekDates[0] + "-to-" + weekDates[DAYS_IN_WEEK - 1] + ".csv";

      var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
      resetExportBtn();
    }).catch(function (err) {
      resetExportBtn();
      setStatus("Couldn't gather this week's bookings for export (" + formatError(err) + ").");
    });
  }
  exportBtn.addEventListener("click", exportWeekCsv);

  /* ---------- Init ---------- */

  function init() {
    renderRoomsKey();
    renderDayTabs();
    renderGridShell();

    // Week / day navigation
    document.getElementById("prevWeek").addEventListener("click", function () { shiftWeek(-7); });
    document.getElementById("nextWeek").addEventListener("click", function () { shiftWeek(7); });

    dayTabsEl.addEventListener("click", function (e) {
      var btn = e.target.closest(".day-tab");
      if (!btn) return;
      selectDate(btn.getAttribute("data-date"));
    });

    gridEl.addEventListener("click", function (e) {
      var btn = e.target.closest(".slot-btn");
      if (!btn) return;
      openCreateModal(btn.getAttribute("data-room"), parseInt(btn.getAttribute("data-slot"), 10));
    });

    if (!ready()) {
      setStatus("Preview mode — bookings are not saved. Add an Apps Script URL to enable saving.");
    }

    subscribeToDate(selectedDate);
  }

  function selectDate(iso) {
    selectedDate = iso;
    renderDayTabs();
    subscribeToDate(selectedDate);
  }

  function shiftWeek(deltaDays) {
    weekStart = mondayOf(addDays(weekStart, deltaDays));
    selectDate(isoDate(weekStart));
  }

  init();
})();
</script>
